name: framework
on: { push: { paths: ['framework/python/**','.github/workflows/framework.yml'] } }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: framework/python } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy qopt
      - run: pytest -q

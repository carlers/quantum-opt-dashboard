# One-time, feature-branch-only commit of externally reviewed immutable fixture.
# Candidate derived in CI 39175488673 and independently examined before enabling this.
name: Commit reviewed exact B QUBO fixture
on:
  push:
    branches:
      - science-frozen-qubo-crosshost-sa
    paths:
      - ".github/workflows/freeze-commit-reviewed-b.yml"
permissions:
  contents: write

jobs:
  record-review-approved-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    if: github.ref == 'refs/heads/science-frozen-qubo-crosshost-sa'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: science-frozen-qubo-crosshost-sa
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source numerical dependencies
        run: >
          python -m pip install
          numpy==2.5.4 scipy==1.18.1 shapely==2.2.0 pyscipopt==6.3.0
      - name: Generate the reviewed historical B/B candidate exactly once
        run: |
          set -euo pipefail
          destination="prototypes/streamlit_water_quality/fixtures/frozen_B_row_sum_qubo.json"
          test ! -e "$destination"
          python prototypes/streamlit_water_quality/freeze_legacy_qubo.py --output "$destination"
          printf '%s  %s\n' '51d47e9a6ad320784019f02110e6543abee60da92453bc26e5c39b91e52398cb' "$destination" | sha256sum --check --status
          echo "Reviewed immutable fixture SHA verified."
      - name: Commit only verified fixture to this review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- prototypes/streamlit_water_quality/fixtures/frozen_B_row_sum_qubo.json
          git diff --cached --name-only | grep -Fx "prototypes/streamlit_water_quality/fixtures/frozen_B_row_sum_qubo.json"
          git commit -m "data(science): pin inspected exact B-mode QUBO and seed fixture"
          git push origin HEAD:refs/heads/science-frozen-qubo-crosshost-sa

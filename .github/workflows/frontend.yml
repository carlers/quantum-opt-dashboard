name: frontend
on: { push: { paths: ['framework/frontend/**','.github/workflows/frontend.yml'] } }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: framework/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'framework/frontend/package-lock.json' }
      - run: npm ci || npm install
      - run: npm run build --if-present

# REVIEW ONLY: Linux kernel resource limits on two simultaneous ORIGINAL LP re-solvers.
# Does not install an isolated worker pool in Streamlit or certify user quotas.
name: Issue108 two Linux-bounded original SCIP LP workers
on:
  pull_request:
    paths:
      - "scripts/issue108_bounded_scip_concurrency.py"
      - "prototypes/unified_dashboard/tests/test_issue108_bounded_scip_workers.py"
      - ".github/workflows/issue108-bounded-scip-workers.yml"
      - "docs/ISSUE_108_LINUX_BOUNDED_SCIP_PROOF.md"
      - "requirements.txt"
      - "prototypes/streamlit_water_quality/pyproject.toml"
      - "prototypes/streamlit_water_quality/model.py"
      - "prototypes/streamlit_water_quality/app.py"
      - "prototypes/streamlit_water_quality/__init__.py"
      - "prototypes/unified_dashboard/pages/water.py"
      - "pyproject.toml"
      - "docs/ISSUE_108_QUALIFIED_WATER_PAGE.md"
      - "prototypes/streamlit_water_quality/scip_lp_reexecution_worker.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue108-bounded-local-scip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  original-n20-two-resource-bounded-scip-children:
    name: Two actually overlapping original LP children with observed Linux resource ceilings
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original scientific research runtime and test requirements
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
          python -m pip check
          command -v prlimit
      - name: Run controlled Linux cancellation/origin tests
        run: |
          python -m compileall -q scripts/issue108_bounded_scip_concurrency.py \
            prototypes/unified_dashboard/tests/test_issue108_bounded_scip_workers.py
          python -m pytest \
            prototypes/unified_dashboard/tests/test_issue108_bounded_scip_workers.py -q -s
      - name: Independently launch TWO real bounded original N20 LP SCIP readers
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -I scripts/issue108_bounded_scip_concurrency.py \
            --output "$RUNNER_TEMP/issue108-original-n20-two-scip-processes.json"
      - name: Verify observed kernel limits, process identity and independent original source optimum
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          report=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"issue108-original-n20-two-scip-processes.json").read_text())
          assert report["schema_version"]==1
          assert report["kind"]=="REVIEW_ONLY_LINUX_TWO_BOUND_SCIP_LP_WORKERS"
          assert report["source_pr_head_sha"]==os.environ["PR_HEAD_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}",report["actual_git_checkout_sha"])
          assert re.fullmatch(r"[0-9a-f]{64}",report["original_lp_sha256"])
          assert 0<report["source_lp_bytes"]<=100000
          assert report["original_scip_status"]=="optimal"
          assert report["two_distinct_processes_simultaneously_waited_at_gate"] is True
          assert report["wall_clock_seconds_max"]<=75
          assert report["original_model"].startswith("N20 K5 local one-hop")
          workers=report["workers"]
          assert len(workers)==2 and len({w["pid"] for w in workers})==2
          for worker in workers:
              assert worker["returncode"]==0
              assert worker["observed_rlimits"]==report["linux_limits_from_inside_children"]
              assert worker["child_status"]=="optimal"
              assert worker["child_selected_indices"]==[0,1,3,6,7]
              assert worker["original_local_feasible"] is True
              assert worker["independent_optimum_exactly_checked"] is True
              assert worker["original_execution_authenticated"] is False
          assert len(report["unverified"])>=4
          print("TWO_BOUND_ORIGINAL_SOURCE_SCIP_LP_CHILDREN_VERIFIED")
          PY
      - name: Preserve bounded unsigned observations only (no source data redistribution)
        uses: actions/upload-artifact@v4
        with:
          name: original-n20-two-linux-bounded-scip-children-UNSIGNED
          path: ${{ runner.temp }}/issue108-original-n20-two-scip-processes.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve honest release trust limits
        run: |
          echo "Linux kernel prlimit observed for two real SCIP LP readers; NOT a runtime Streamlit worker pool, multi-user sandbox, Cloud deployment or hostile memory stress test." >> "$GITHUB_STEP_SUMMARY"
          echo "No actual API/GUI concurrency quotas, signed remote result, author AHP/D2 manuscript parity, field RF/DO/current or quantum hardware claim." >> "$GITHUB_STEP_SUMMARY"

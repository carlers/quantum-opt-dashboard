# #62 isolated, source-preserving NumPy dispatch intervention.
# NPY_DISABLE_CPU_FEATURES is set on the process launcher BEFORE Python imports numpy.
name: N20 exact NumPy binary-dispatch controls
on:
  pull_request:
    paths:
      - "scripts/n20_numpy_dispatch_audit.py"
      - "scripts/tests/test_n20_numpy_dispatch_audit.py"
      - "scripts/n20_frozen_math_microprobe.py"
      - ".github/workflows/n20-numpy-dispatch-controls.yml"
      - "docs/N20_NUMPY_DISPATCH_PROTOCOL.md"
      - "docs/N20_NUMPY_DISPATCH_RESULTS.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired-modes:
    name: Paired AVX2-FMA3 intervention / ${{ matrix.host }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        host: [r1, r2, r3]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact previous NumPy direct dependency
        run: python -m pip install numpy==2.5.4
      - name: Run baseline process A (unmasked)
        run: >
          python -m scripts.n20_numpy_dispatch_audit
          --mode baseline --replica ${{ matrix.host }}-baseline-a
          --output "$RUNNER_TEMP/dispatch-${{ matrix.host }}-baseline-a.json"
      - name: Run baseline process B (new interpreter, unmasked)
        run: >
          python -m scripts.n20_numpy_dispatch_audit
          --mode baseline --replica ${{ matrix.host }}-baseline-b
          --output "$RUNNER_TEMP/dispatch-${{ matrix.host }}-baseline-b.json"
      - name: Run masked process A (fresh interpreter)
        env:
          NPY_DISABLE_CPU_FEATURES: "AVX2,FMA3"
        run: >
          python -m scripts.n20_numpy_dispatch_audit
          --mode no-avx2-fma3 --replica ${{ matrix.host }}-no-avx2-fma3-a
          --output "$RUNNER_TEMP/dispatch-${{ matrix.host }}-no-avx2-fma3-a.json"
      - name: Run masked process B (new interpreter, same mask)
        env:
          NPY_DISABLE_CPU_FEATURES: "AVX2,FMA3"
        run: >
          python -m scripts.n20_numpy_dispatch_audit
          --mode no-avx2-fma3 --replica ${{ matrix.host }}-no-avx2-fma3-b
          --output "$RUNNER_TEMP/dispatch-${{ matrix.host }}-no-avx2-fma3-b.json"
      - name: Archive all four unaltered mode/process JSON records
        uses: actions/upload-artifact@v4
        with:
          name: n20-dispatch-${{ matrix.host }}
          path: ${{ runner.temp }}/dispatch-*.json
          retention-days: 14
          if-no-files-found: error
  compare-paired:
    name: Validate binary provenance and all 12 outputs
    needs: paired-modes
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy and run ten falsification tests
        run: |
          python -m pip install numpy==2.5.4
          python -m compileall -q scripts/n20_numpy_dispatch_audit.py
          python -m unittest discover -s scripts/tests -p "test_n20_numpy_dispatch_audit.py" -v
      - name: Retrieve original per-process evidence
        uses: actions/download-artifact@v4
        with:
          pattern: n20-dispatch-r*
          path: _n20_dispatch_records
          merge-multiple: false
      - name: Independently compare every frozen input and NumPy output
        run: >
          python -m scripts.n20_numpy_dispatch_audit
          --inputs-root _n20_dispatch_records
          --report _n20_dispatch_comparison.json
      - name: Archive full binary/runtime and within-host intervention report
        uses: actions/upload-artifact@v4
        with:
          name: n20-numpy-dispatch-paired-comparison
          path: _n20_dispatch_comparison.json
          retention-days: 14
          if-no-files-found: error

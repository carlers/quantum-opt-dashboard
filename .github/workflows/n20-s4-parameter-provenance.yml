# Owner-approved review-only N20 scientific audit; NO alternative parameter ranges.
# Previous DRAFT #83 records source/manuscript provenance gates before this code.
name: N20 S4 original spatial AHP provenance gate
on:
  pull_request:
    paths:
      - "scripts/studies/n20_s4_parameter_provenance.py"
      - "scripts/tests/test_n20_s4_parameter_provenance.py"
      - "docs/research_protocols/N20_S4_PARAMETER_PROVENANCE_GATES_2026_10_19.md"
      - "docs/research_results/N20_S4_PARAMETER_PROVENANCE_FINDINGS_2026_10_19.md"
      - ".github/workflows/n20-s4-parameter-provenance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-only-audit:
    name: Reproduce original N20 SCIP and verify factor AHP and spatial provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install original isolated scientific notebook deps
        run: python -m pip install -r problems/water_quality/notebooks/requirements-n20.txt
      - name: Compile frozen baseline-only scientific audit and verify earlier documentation
        run: |
          python -m compileall -q scripts/studies/n20_s4_parameter_provenance.py scripts/tests/test_n20_s4_parameter_provenance.py
          test -f docs/research_protocols/N20_S4_PARAMETER_PROVENANCE_GATES_2026_10_19.md
      - name: Falsify AHP matrix reciprocity and source-factor missing handling
        run: python -m unittest discover -s scripts/tests -p "test_n20_s4_parameter_provenance.py" -v
      - name: Fresh kernel unchanged source notebook original N20 and actual SCIP
        run: python scripts/run_n20_reference_notebook.py --result "$RUNNER_TEMP/n20-original-parameter-source.json"
      - name: Independent actual GeoJSON original 190 free-free and 300 free-fixed pair check
        run: >
          python -m scripts.n20_independent_geometry_audit
          --result "$RUNNER_TEMP/n20-original-parameter-source.json"
          --output "$RUNNER_TEMP/n20-original-source-spatial-certificate.json"
      - name: Audit only ORIGINAL factor completeness AHP transcription and threshold margins
        run: >
          python -m scripts.studies.n20_s4_parameter_provenance
          --reference "$RUNNER_TEMP/n20-original-parameter-source.json"
          --output "$RUNNER_TEMP/n20-original-S4-parameter-provenance.json"
      - name: Archive small source-only certificate NO manuscript DOCX or new GIS data
        uses: actions/upload-artifact@v4
        with:
          name: n20-s4-original-only-parameter-provenance
          path: |
            ${{ runner.temp }}/n20-original-parameter-source.json
            ${{ runner.temp }}/n20-original-source-spatial-certificate.json
            ${{ runner.temp }}/n20-original-S4-parameter-provenance.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve scientific boundaries
        run: |
          echo "Only ORIGINAL N20 parameters and manuscript-transcribed AHP matrix were audited, not varied." >> "$GITHUB_STEP_SUMMARY"
          echo "No source-justified ranges, measured RF/hydrodynamics or raw expert worksheets were supplied." >> "$GITHUB_STEP_SUMMARY"
          echo "This CI is computational provenance, not paper exact input or physically validated placement." >> "$GITHUB_STEP_SUMMARY"
          echo "No original source, main/preview/production, manuscript or deployed app changed." >> "$GITHUB_STEP_SUMMARY"

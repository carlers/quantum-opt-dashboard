# Mathematical source evidence only. No paper/physical certification or promotion.
name: N20 scientific claim and objective-integrity gate
on:
  pull_request:
    paths:
      - "scripts/science_claim_gate.py"
      - "scripts/tests/test_science_claim_gate.py"
      - "docs/SCIENTIFIC_CLAIM_CONTRACT.md"
      - ".github/workflows/n20-scientific-claim-gate.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-source-provenance:
    name: Cold N20 SCIP and raw GeoJSON then fail-closed three-level claim certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated original scientific dependencies
        run: python -m pip install -r problems/water_quality/notebooks/requirements-n20.txt
      - name: Compile and test mathematical objective comparability and claim spoofing
        run: |
          python -m compileall -q scripts/science_claim_gate.py scripts/tests/test_science_claim_gate.py
          python -m unittest discover -s scripts/tests -p "test_science_claim_gate.py" -v
      - name: Fresh original N20 notebook and SCIP mathematical source replay
        run: python scripts/run_n20_reference_notebook.py --result "$RUNNER_TEMP/n20-verified-original.json"
      - name: Independently reconstruct raw GeoJSON original source graph
        run: >
          python -m scripts.n20_independent_geometry_audit
          --result "$RUNNER_TEMP/n20-verified-original.json"
          --output "$RUNNER_TEMP/n20-verified-raw-geometry.json"
      - name: Independently rebuild S4 original factor/AHP/parameter provenance
        run: >
          python -m scripts.studies.n20_s4_parameter_provenance
          --reference "$RUNNER_TEMP/n20-verified-original.json"
          --output "$RUNNER_TEMP/n20-verified-S4-provenance.json"
      - name: Emit explicit verified-source/block-manuscript/block-physical claim certificate
        run: >
          python -m scripts.science_claim_gate
          --reference "$RUNNER_TEMP/n20-verified-original.json"
          --provenance "$RUNNER_TEMP/n20-verified-S4-provenance.json"
          --output "$RUNNER_TEMP/n20-source-only-scientific-claim-certificate.json"
      - name: Archive limited small historical source and proof inputs
        uses: actions/upload-artifact@v4
        with:
          name: n20-scientific-claims-source-only-integrity
          path: |
            ${{ runner.temp }}/n20-verified-original.json
            ${{ runner.temp }}/n20-verified-raw-geometry.json
            ${{ runner.temp }}/n20-verified-S4-provenance.json
            ${{ runner.temp }}/n20-source-only-scientific-claim-certificate.json
          retention-days: 14
          if-no-files-found: error
      - name: Summarize what is and is not scientifically supported
        run: |
          echo "PASS: original notebook-derived N20/K5 computational verification ONLY." >> "$GITHUB_STEP_SUMMARY"
          echo "BLOCKED: historical manuscript AHP/GIS/D2/SCIP input reconciliation." >> "$GITHUB_STEP_SUMMARY"
          echo "BLOCKED: lake shoreline, physical radio links, water-quality current/transport calibration." >> "$GITHUB_STEP_SUMMARY"
          echo "NOT performed: any alternative parameter sweep, model adoption, merger, preview/production release." >> "$GITHUB_STEP_SUMMARY"

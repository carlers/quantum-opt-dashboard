name: Private scientific evidence staging and restore
on:
  pull_request:
    paths:
      - "problems/water_quality/evidence_archive.py"
      - "prototypes/unified_dashboard/tests/test_evidence_archive.py"
      - "docs/OCI_EVIDENCE_STAGING.md"
      - ".github/workflows/private-evidence-staging.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific CI dependencies
        run: |
          python -m pip install -r requirements.txt "pytest>=8,<10"
          python -m pip check
      - name: Validate real original-source SCIP evidence and immutable archive drill
        env:
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: |
          python -m pytest -q -s prototypes/unified_dashboard/tests/test_evidence_archive.py
      - name: Scope reminder
        run: |
          echo "Local integrity, confidentiality-mode and offline restore drills only. Off-VM transfer, queue database restore, credentials, OIDC and automation are NOT part of this test." >> "$GITHUB_STEP_SUMMARY"

# Required fast gate for prototype pull requests and approved pilot pushes.
# Bounded stochastic evidence is a SEPARATE workflow (see #34).
name: Streamlit pilot fast regression

on:
  pull_request:
    paths:
      - "prototypes/streamlit_water_quality/**"
      - "prototypes/unified_dashboard/**"
      - "requirements.txt"
      - "prototypes/research_standalone.py"
      - "prototypes/water_import_guard.py"
      - "prototypes/unified_dashboard/tests/test_water_import_origin_guard.py"
      - "docs/ISSUE_108_WATER_ORIGIN_PREFLIGHT.md"
      - "scripts/browser_route_concurrency.py"
      - ".github/workflows/unified-browser-concurrency.yml"
      - "docs/ISSUE_108_LOCAL_BROWSER_MULTISESSION.md"
      - ".github/workflows/streamlit-pilot.yml"
      - ".github/workflows/streamlit-research-evidence.yml"
  push:
    branches:
      - "plugin-water-streamlit-pilot"
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"

permissions:
  contents: read

concurrency:
  group: pilot-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-tests:
    name: Full fast Python/Streamlit/SCIP regression (no 3072/4096-read study)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install integrated numerical, exact SCIP and pinned classical SA dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
      - name: Check Python syntax
        run: python -m compileall -q prototypes/streamlit_water_quality prototypes/unified_dashboard
      - name: Run all model, QUBO, SCIP, replay and Streamlit UI tests
        run: python -m pytest prototypes/streamlit_water_quality/tests prototypes/unified_dashboard/tests -q -s
      - name: Independently archive K5 all-15-fixed wireless graph source certificate
        run: >
          python prototypes/streamlit_water_quality/export_global_reference.py
          --output "$RUNNER_TEMP/n20-all-original-stations-global-network.json"
      - name: Archive bounded all-stations network evidence
        uses: actions/upload-artifact@v4
        with:
          name: n20-original-source-all-15-fixed-global-network
          path: ${{ runner.temp }}/n20-all-original-stations-global-network.json
          if-no-files-found: error
          retention-days: 14

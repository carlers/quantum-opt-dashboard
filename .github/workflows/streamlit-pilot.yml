# Required fast gate for prototype pull requests and approved pilot pushes.
# Bounded stochastic evidence is a SEPARATE workflow (see #34).
name: Streamlit pilot fast regression

on:
  pull_request:
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"
      - ".github/workflows/streamlit-research-evidence.yml"
  push:
    branches:
      - "plugin-water-streamlit-pilot"
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"

permissions:
  contents: read

concurrency:
  group: pilot-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  model-tests:
    name: Full fast Python/Streamlit/SCIP regression (no 3072/4096-read study)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SCIP, classical sampler and validation dependencies
        run: python -m pip install "numpy>=2,<3" "scipy>=1.11,<2" "shapely>=2,<3" "pyscipopt>=5,<7" "pytest>=8" "openjij==0.12.2" "pyyaml>=6,<7"
      - name: Install dashboard smoke-test dependencies
        run: python -m pip install -r prototypes/streamlit_water_quality/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q prototypes/streamlit_water_quality
      - name: Run all model, QUBO, SCIP, replay and Streamlit UI tests
        run: python -m pytest prototypes/streamlit_water_quality/tests -q -s

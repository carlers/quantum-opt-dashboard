name: Streamlit water-quality pilot

on:
  pull_request:
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"
  push:
    branches:
      - "plugin-water-streamlit-pilot"
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model and SCIP validation dependencies
        run: python -m pip install "numpy>=2,<3" "scipy>=1.11,<2" "shapely>=2,<3" "pyscipopt>=5,<7" "pytest>=8" "openjij==0.12.2"
      - name: Check Python syntax
        run: python -m compileall -q prototypes/streamlit_water_quality
      - name: Run model invariants
        run: python -m pytest prototypes/streamlit_water_quality/tests -q -s

      - name: Generate automated N20 scientific evidence bundles
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python prototypes/streamlit_water_quality/evidence.py \
            --output-dir "${{ runner.temp }}/n20-scip-evidence" \
            --scenario all --time-limit 120
      - name: Upload N20 provenance and solver results
        uses: actions/upload-artifact@v4
        with:
          name: n20-scip-evidence
          path: ${{ runner.temp }}/n20-scip-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Run bounded seeded classical OpenJij SA benchmark
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python prototypes/streamlit_water_quality/sa_benchmark.py \
            --output-dir "${{ runner.temp }}/n20-sa-benchmark" \
            --seeds "20261018,20261019,20261020" --reads 32 --sweeps 300
      - name: Upload SA repeat-level results and all sampled states
        uses: actions/upload-artifact@v4
        with:
          name: n20-openjij-sa-benchmark
          path: ${{ runner.temp }}/n20-sa-benchmark
          if-no-files-found: error
          retention-days: 14

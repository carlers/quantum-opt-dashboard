name: Streamlit water-quality pilot

on:
  pull_request:
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"
  push:
    branches:
      - "plugin-water-streamlit-pilot"
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"

jobs:
  model-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install model and SCIP validation dependencies
        run: python -m pip install "numpy>=2,<3" "scipy>=1.11,<2" "shapely>=2,<3" "pyscipopt>=5,<7" "pytest>=8"
      - name: Check Python syntax
        run: python -m compileall -q prototypes/streamlit_water_quality
      - name: Run model invariants
        run: python -m pytest prototypes/streamlit_water_quality/tests -q

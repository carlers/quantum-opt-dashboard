name: Streamlit water-quality pilot

on:
  pull_request:
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"
  push:
    branches:
      - "plugin-water-streamlit-pilot"
    paths:
      - "prototypes/streamlit_water_quality/**"
      - ".github/workflows/streamlit-pilot.yml"

jobs:
  model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned-major SCIP and Streamlit MVP dependencies
        run: |
          python -m pip install -r prototypes/streamlit_water_quality/requirements.txt
          python -m pip install "pytest>=8,<10"
      - name: Check Python syntax
        run: python -m compileall -q prototypes/streamlit_water_quality
      - name: Run N20 scientific audit and real headless Streamlit MVP interactions
        run: python -m pytest prototypes/streamlit_water_quality/tests -q -s

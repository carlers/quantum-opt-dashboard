# Full bounded research evidence is intentionally NOT run for every UI/doc PR.
# On a research-model/solver change it runs automatically; after this workflow
# is merged to default it can also be run explicitly via workflow_dispatch.
# Workflow CI artifacts expire after 14 days and are NOT archival releases.
name: Water-quality research evidence (SCIP + classical OpenJij)

on:
  pull_request:
    paths:
      - "problems/water_quality/data/**"
      - "problems/water_quality/notebooks/**"
      - "prototypes/streamlit_water_quality/model.py"
      - "prototypes/streamlit_water_quality/qubo.py"
      - "prototypes/streamlit_water_quality/formulation_audit.py"
      - "prototypes/streamlit_water_quality/evidence.py"
      - "prototypes/streamlit_water_quality/sa_benchmark.py"
      - "prototypes/streamlit_water_quality/sa_paired_replication.py"
      - "prototypes/streamlit_water_quality/sa_ulp_replay.py"
      - "prototypes/streamlit_water_quality/precision_probe.py"
      - "prototypes/streamlit_water_quality/compare_archived_sa.py"
      - "prototypes/streamlit_water_quality/requirements.txt"
      - "prototypes/streamlit_water_quality/tests/test_evidence_export.py"
      - "prototypes/streamlit_water_quality/tests/test_n20_reference.py"
      - "prototypes/streamlit_water_quality/tests/test_qubo.py"
      - "prototypes/streamlit_water_quality/tests/test_sa_benchmark.py"
      - "prototypes/streamlit_water_quality/tests/test_sa_paired_replication.py"
      - "prototypes/streamlit_water_quality/tests/test_sa_ulp_replay.py"
      - "prototypes/streamlit_water_quality/tests/test_scip_solver.py"
      - "prototypes/streamlit_water_quality/tests/test_precision_probe.py"
      - "prototypes/streamlit_water_quality/tests/test_compare_archived_sa.py"
      - ".github/workflows/streamlit-research-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: science-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frozen-research-evidence:
    name: Bounded SCIP reference + OpenJij classical research
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned-SA scientific validation dependencies
        run: python -m pip install "numpy>=2,<3" "scipy>=1.11,<2" "shapely>=2,<3" "pyscipopt>=5,<7" "pytest>=8" "openjij==0.12.2" "pyyaml>=6,<7"
      - name: Syntax-check research modules
        run: python -m compileall -q prototypes/streamlit_water_quality
      - name: Run numerical proof tests (without dashboard AppTest)
        run: python -m pytest prototypes/streamlit_water_quality/tests --ignore=prototypes/streamlit_water_quality/tests/test_inspector_app_smoke.py -q -s

      - name: Generate automated N20 scientific evidence bundles
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python prototypes/streamlit_water_quality/evidence.py \
            --output-dir "${{ runner.temp }}/n20-scip-evidence" \
            --scenario all --time-limit 120
      - name: Upload N20 provenance and solver results
        uses: actions/upload-artifact@v4
        with:
          name: n20-scip-evidence
          path: ${{ runner.temp }}/n20-scip-evidence
          if-no-files-found: error
          retention-days: 14
      - name: Run bounded seeded classical OpenJij SA benchmark
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python prototypes/streamlit_water_quality/sa_benchmark.py \
            --output-dir "${{ runner.temp }}/n20-sa-benchmark" \
            --seeds "20261018,20261019,20261020" --reads 32 --sweeps 300
      - name: Upload SA repeat-level results and all sampled states
        uses: actions/upload-artifact@v4
        with:
          name: n20-openjij-sa-benchmark
          path: ${{ runner.temp }}/n20-sa-benchmark
          if-no-files-found: error
          retention-days: 14

      - name: Run pre-registered N20 paired-seed replication
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python prototypes/streamlit_water_quality/sa_paired_replication.py \
            --output-dir "${{ runner.temp }}/n20-sa-paired-replication"
      - name: Upload N20 paired-block uncertainty and all sampled states
        uses: actions/upload-artifact@v4
        with:
          name: n20-sa-paired-replication
          path: ${{ runner.temp }}/n20-sa-paired-replication
          if-no-files-found: error
          retention-days: 14

      - name: Export N20 exact float64 coefficient provenance
        env:
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python prototypes/streamlit_water_quality/precision_probe.py \
            --output-dir "${{ runner.temp }}/n20-precision-probe"
      - name: Upload exact N20 model and QUBO float precision probe
        uses: actions/upload-artifact@v4
        with:
          name: n20-precision-probe
          path: ${{ runner.temp }}/n20-precision-probe
          if-no-files-found: error
          retention-days: 14

      - name: Replay controlled archived A/B last-bit QUBO perturbations
        run: |
          python prototypes/streamlit_water_quality/sa_ulp_replay.py \
            --output-dir "${{ runner.temp }}/n20-ulp-controlled-replay"
      - name: Upload ULP sensitivity replay states and per-arm summaries
        uses: actions/upload-artifact@v4
        with:
          name: n20-ulp-controlled-replay
          path: ${{ runner.temp }}/n20-ulp-controlled-replay
          if-no-files-found: error
          retention-days: 14

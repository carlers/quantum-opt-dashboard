# Local-only genuine Chromium sessions; NOT production Cloud preview validation.
name: Unified local Chromium two-session navigation proof
on:
  pull_request:
    paths:
      - "scripts/browser_route_concurrency.py"
      - ".github/workflows/unified-browser-concurrency.yml"
      - "prototypes/unified_dashboard/**"
      - "prototypes/streamlit_configurable/**"
      - "prototypes/streamlit_water_quality/**"
      - "problems/evacuation_centers/bundle_runner.py"
      - "problems/water_quality/water_bundle_adapter.py"
      - "pyproject.toml"
      - "requirements.txt"
      - "prototypes/isolated_water_scip.py"
      - "prototypes/unified_dashboard/tests/test_review_bounded_scip.py"
      - "docs/ISSUE_108_OPTIONAL_LIVE_BOUNDED_SCIP.md"
      - "docs/ISSUE_108_SCIP_PARENT_DEATH.md"
      - "scripts/browser_bounded_scip_download.py"
      - ".github/workflows/issue108-browser-bounded-scip-download.yml"
      - "docs/ISSUE_108_BROWSER_BOUNDED_SCIP_DOWNLOAD.md"
      - "scripts/issue108_bounded_scip_concurrency.py"
      - "prototypes/unified_dashboard/tests/test_issue108_bounded_scip_workers.py"
      - ".github/workflows/issue108-bounded-scip-workers.yml"
      - "docs/ISSUE_108_LINUX_BOUNDED_SCIP_PROOF.md"
      - "prototypes/streamlit_water_quality/pyproject.toml"
      - "prototypes/unified_dashboard/tests/test_installed_legacy_water_imports.py"
      - "docs/ISSUE_108_INSTALLED_WATER_LEGACY_IMPORTS.md"
      - "prototypes/research_standalone.py"
      - "prototypes/water_import_guard.py"
      - "prototypes/unified_dashboard/tests/test_water_import_origin_guard.py"
      - "docs/ISSUE_108_WATER_ORIGIN_PREFLIGHT.md"
      - "docs/ISSUE_108_LOCAL_BROWSER_MULTISESSION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-browser-issue108-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  overlapping-local-browser-contexts:
    name: Two independent browser WebSockets in one local Streamlit runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual research app and test-only local browser tooling
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.55,<2"
          python -m pip check
      - name: Install headless Chromium and its local runner libraries
        run: python -m playwright install --with-deps chromium
      - name: Assert source files compile
        run: python -m compileall -q scripts/browser_route_concurrency.py
      - name: Verify two overlapping live isolated browser contexts against a LOCAL server
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -I scripts/browser_route_concurrency.py \
            --output "$RUNNER_TEMP/issue108-local-browser-multisession.json"
      - name: Fail closed on non-observed parallel browser evidence
        run: |
          python - <<'PY'
          import json, os, pathlib, re
          artifact=pathlib.Path(os.environ["RUNNER_TEMP"])/"issue108-local-browser-multisession.json"
          report=json.loads(artifact.read_text())
          assert report["kind"]=="LOCAL_EPHEMERAL_HEADLESS_CHROMIUM_MULTISESSION_NAVIGATION_ONLY"
          assert report["contexts"]==2
          assert report["independent_streamlit_websocket_connections_observed"] is True
          assert len(report["route_pairs"])==5
          assert any(x["a"]=="custom" and x["b"]=="research" for x in report["route_pairs"])
          assert any(x["a"]=="water" and x["b"]=="about" for x in report["route_pairs"])
          for label in ("source_pr_head_sha","actual_git_checkout_sha"):
              assert re.fullmatch(r"[0-9a-f]{40}",report[label])
          assert any("NOT a safety certification" in s for s in report["limitations"])
          PY
      - name: Archive bounded unsigned local browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: local-headless-streamlit-two-real-browser-sessions-UNSIGNED
          path: |
            ${{ runner.temp }}/issue108-local-browser-multisession.json
            ${{ runner.temp }}/local-browser-streamlit-server.log
          retention-days: 14
          if-no-files-found: error
      - name: State live Cloud and scientific limitations
        run: |
          echo "Genuine Chromium contexts used a same-host ephemeral loopback Streamlit; NOT permanent preview/production browser testing." >> "$GITHUB_STEP_SUMMARY"
          echo "No actual ZIP download, hostile qualified import collision, OS user quota, source manuscript/field/quantum/signer claim." >> "$GITHUB_STEP_SUMMARY"

# Test the ONE integrated Streamlit app, not just its standalone prototypes.
name: Unified scientific dashboard integration

on:
  pull_request:
    paths:
      - "prototypes/unified_dashboard/**"
      - "prototypes/streamlit_configurable/**"
      - "prototypes/streamlit_water_quality/**"
      - "problems/water_quality/**"
      - "problems/evacuation_centers/**"
      - "framework/python/qopt/core/**"
      - "contracts/**"
      - "requirements.txt"
      - "prototypes/isolated_water_scip.py"
      - "prototypes/unified_dashboard/tests/test_review_bounded_scip.py"
      - "docs/ISSUE_108_OPTIONAL_LIVE_BOUNDED_SCIP.md"
      - "scripts/issue108_bounded_scip_concurrency.py"
      - "prototypes/unified_dashboard/tests/test_issue108_bounded_scip_workers.py"
      - ".github/workflows/issue108-bounded-scip-workers.yml"
      - "docs/ISSUE_108_LINUX_BOUNDED_SCIP_PROOF.md"
      - "prototypes/streamlit_water_quality/pyproject.toml"
      - "prototypes/unified_dashboard/tests/test_installed_legacy_water_imports.py"
      - "docs/ISSUE_108_INSTALLED_WATER_LEGACY_IMPORTS.md"
      - "prototypes/research_standalone.py"
      - "prototypes/water_import_guard.py"
      - "prototypes/unified_dashboard/tests/test_water_import_origin_guard.py"
      - "docs/ISSUE_108_WATER_ORIGIN_PREFLIGHT.md"
      - "scripts/browser_route_concurrency.py"
      - ".github/workflows/unified-browser-concurrency.yml"
      - "docs/ISSUE_108_LOCAL_BROWSER_MULTISESSION.md"
      - ".github/workflows/unified-mvp.yml"

permissions:
  contents: read

jobs:
  integrated-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install one supported integrated environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
      - name: Validate the Python entrypoints compile
        run: python -m compileall -q prototypes/unified_dashboard prototypes/streamlit_configurable prototypes/streamlit_water_quality framework/python/qopt/core problems/evacuation_centers problems/water_quality
      - name: Test shared navigation and three user journeys
        run: python -m pytest prototypes/unified_dashboard/tests -q -s
      - name: Test configurable/synthetic mathematical editor and domain solver proofs
        run: python -m pytest prototypes/streamlit_configurable/tests problems/evacuation_centers/tests problems/water_quality/tests -q -s

# Research MVP installed-runtime observation, NOT a lock or original science claim.
name: Unified Python 3.12 observed runtime provenance
on:
  pull_request:
    paths:
      - "scripts/release_runtime_manifest.py"
      - "scripts/import_namespace_inventory.py"
      - "pyproject.toml"
      - "prototypes/unified_dashboard/tests/test_qualified_water_page.py"
      - "docs/ISSUE_108_QUALIFIED_WATER_PAGE.md"
      - "prototypes/unified_dashboard/__init__.py"
      - "prototypes/unified_dashboard/tests/test_qualified_research_route.py"
      - "docs/ISSUE_108_QUALIFIED_RESEARCH_ROUTE.md"
      - "framework/python/qopt/core/**"
      - "prototypes/unified_dashboard/tests/test_qualified_framework_imports.py"
      - "prototypes/unified_dashboard/tests/test_qualified_custom_route.py"
      - "prototypes/water_import_guard.py"
      - "prototypes/unified_dashboard/tests/test_water_import_origin_guard.py"
      - "docs/ISSUE_108_WATER_ORIGIN_PREFLIGHT.md"
      - "docs/ISSUE_108_QUALIFIED_CUSTOM_ROUTE.md"
      - "docs/ISSUE_108_INSTALLED_FRAMEWORK_IMPORTS.md"
      - "prototypes/streamlit_configurable/**"
      - "problems/evacuation_centers/**"
      - "problems/water_quality/water_bundle_adapter.py"
      - "problems/water_quality/__init__.py"
      - "prototypes/unified_dashboard/tests/test_qualified_water_adapter_imports.py"
      - "docs/ISSUE_108_QUALIFIED_WATER_ADAPTER.md"
      - "problems/__init__.py"
      - "prototypes/unified_dashboard/tests/test_qualified_synthetic_imports.py"
      - "prototypes/__init__.py"
      - "prototypes/unified_dashboard/tests/test_qualified_editor_imports.py"
      - "docs/ISSUE_108_QUALIFIED_EDITOR_IMPORT_MIGRATION.md"
      - "prototypes/unified_dashboard/tests/test_import_namespace_inventory.py"
      - "docs/ISSUE_108_IMPORT_NAMESPACE_MIGRATION_PLAN.md"
      - "prototypes/unified_dashboard/tests/test_runtime_provenance.py"
      - "prototypes/unified_dashboard/pages/**"
      - "prototypes/unified_dashboard/research.py"
      - "requirements.txt"
      - "prototypes/isolated_water_scip.py"
      - "prototypes/unified_dashboard/tests/test_review_bounded_scip.py"
      - "docs/ISSUE_108_OPTIONAL_LIVE_BOUNDED_SCIP.md"
      - "docs/ISSUE_108_SCIP_PARENT_DEATH.md"
      - "scripts/browser_bounded_scip_download.py"
      - ".github/workflows/issue108-browser-bounded-scip-download.yml"
      - "docs/ISSUE_108_BROWSER_BOUNDED_SCIP_DOWNLOAD.md"
      - "scripts/issue108_bounded_scip_concurrency.py"
      - "prototypes/unified_dashboard/tests/test_issue108_bounded_scip_workers.py"
      - ".github/workflows/issue108-bounded-scip-workers.yml"
      - "docs/ISSUE_108_LINUX_BOUNDED_SCIP_PROOF.md"
      - "prototypes/streamlit_water_quality/pyproject.toml"
      - "prototypes/unified_dashboard/tests/test_installed_legacy_water_imports.py"
      - "docs/ISSUE_108_INSTALLED_WATER_LEGACY_IMPORTS.md"
      - "prototypes/research_standalone.py"
      - "scripts/browser_route_concurrency.py"
      - ".github/workflows/unified-browser-concurrency.yml"
      - "docs/ISSUE_108_LOCAL_BROWSER_MULTISESSION.md"
      - "prototypes/unified_dashboard/requirements.txt"
      - "prototypes/streamlit_water_quality/requirements.txt"
      - ".github/workflows/unified-runtime-provenance.yml"
      - "docs/UNIFIED_RUNTIME_PROVENANCE_TRUST_BOUNDARY_2026_10_20.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observed-runtime-not-locked:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the SAME current research dashboard runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "pytest>=8,<10"
          python -m pip check
      - name: Syntax and actual routed scientific module origins
        run: |
          python -m compileall -q prototypes/isolated_water_scip.py
          python -m compileall -q scripts/release_runtime_manifest.py scripts/import_namespace_inventory.py scripts/issue108_bounded_scip_concurrency.py \
            prototypes/unified_dashboard/tests/test_runtime_provenance.py \
            prototypes/unified_dashboard/tests/test_import_namespace_inventory.py \
            prototypes/unified_dashboard/tests/test_qualified_editor_imports.py \
            prototypes/unified_dashboard/tests/test_qualified_synthetic_imports.py \
            prototypes/unified_dashboard/tests/test_qualified_water_adapter_imports.py \
            prototypes/unified_dashboard/tests/test_qualified_framework_imports.py \
            prototypes/unified_dashboard/tests/test_qualified_custom_route.py \
            prototypes/unified_dashboard/tests/test_water_import_origin_guard.py \
            prototypes/unified_dashboard/tests/test_qualified_research_route.py \
            prototypes/unified_dashboard/tests/test_qualified_water_page.py \
            prototypes/unified_dashboard/tests/test_review_bounded_scip.py \
            prototypes/unified_dashboard/tests/test_installed_legacy_water_imports.py \
            prototypes/unified_dashboard/tests/test_issue108_bounded_scip_workers.py \
            prototypes/research_standalone.py \
            prototypes/water_import_guard.py
          python -m pytest \
            prototypes/unified_dashboard/tests/test_runtime_provenance.py \
            prototypes/unified_dashboard/tests/test_import_namespace_inventory.py \
            prototypes/unified_dashboard/tests/test_qualified_editor_imports.py \
            prototypes/unified_dashboard/tests/test_qualified_synthetic_imports.py \
            prototypes/unified_dashboard/tests/test_qualified_water_adapter_imports.py \
            prototypes/unified_dashboard/tests/test_qualified_framework_imports.py \
            prototypes/unified_dashboard/tests/test_qualified_custom_route.py \
            prototypes/unified_dashboard/tests/test_water_import_origin_guard.py \
            prototypes/unified_dashboard/tests/test_qualified_research_route.py \
            prototypes/unified_dashboard/tests/test_qualified_water_page.py \
            prototypes/unified_dashboard/tests/test_review_bounded_scip.py \
            prototypes/unified_dashboard/tests/test_installed_legacy_water_imports.py \
            prototypes/unified_dashboard/tests/test_issue108_bounded_scip_workers.py \
            -q -s
      - name: Observe process-global import hazards without executing source science
        run: |
          python -I scripts/import_namespace_inventory.py \
            --output "$RUNNER_TEMP/issue108-import-namespace-observed.json"
          test -s "$RUNNER_TEMP/issue108-import-namespace-observed.json"
      - name: Freeze every actually installed distribution, do not lock or guess
        run: |
          python -m pip freeze --all > "$RUNNER_TEMP/observed-py312-installed-freeze.txt"
          test -s "$RUNNER_TEMP/observed-py312-installed-freeze.txt"
      - name: Standalone inventory from clean Python 3.12 worker
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -I scripts/release_runtime_manifest.py \
            --freeze "$RUNNER_TEMP/observed-py312-installed-freeze.txt" \
            --output "$RUNNER_TEMP/unified-py312-runtime-observed.json" \
            --actual-checkout-sha "$(git rev-parse HEAD)" \
            --pull-request-head-sha "$PR_HEAD_SHA" \
            --require-python-312
      - name: Verify actual provenance contains no paper or physical certification
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          m=json.loads((root/"unified-py312-runtime-observed.json").read_text())
          freeze=(root/"observed-py312-installed-freeze.txt").read_bytes()
          assert m["schema_version"]==1
          assert m["python"]["version"].startswith("3.12.")
          assert m["canonical_unified_entrypoint"]=="prototypes/unified_dashboard/app.py"
          assert len(m["exact_installed_dependency_versions"])==10
          assert m["pip_freeze_sha256"]==hashlib.sha256(freeze).hexdigest()
          assert m["pip_freeze_bytes"]==len(freeze)
          assert m["original_GeoJSON_sha256"]=="e303cce3d6af6ff4162bb31e09ca27215bc4e29b164fa0181e3f6931de3ae3a7"
          assert re.fullmatch("[0-9a-f]{40}",m["actual_checkout_git_sha"])
          assert re.fullmatch("[0-9a-f]{40}",m["pull_request_head_git_sha"])
          for flag in ["published_manuscript_input_parity_established",
                       "empirical_lake_RF_DO_validated",
                       "quantum_hardware_or_advantage_demonstrated",
                       "external_signer_or_remote_execution_attested"]:
              assert m["scientific_status"][flag] is False,flag
          print("UNIFIED_RUNTIME_VERSION_MANIFEST_VERIFIED",m["exact_installed_dependency_versions"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unified-actual-installed-python312-scientific-runtime-UNSIGNED
          path: |
            ${{ runner.temp }}/observed-py312-installed-freeze.txt
            ${{ runner.temp }}/unified-py312-runtime-observed.json
            ${{ runner.temp }}/issue108-import-namespace-observed.json
          retention-days: 14
          if-no-files-found: error
      - name: Preserve honest scientific and trust boundaries
        run: |
          echo "These installed version bytes describe THIS Python 3.12 CI worker ONLY, not a lockfile, trusted signed receipt or portable binary64 coefficient identity." >> "$GITHUB_STEP_SUMMARY"
          echo "Original source SCIP coefficient drift is separately tracked. No manuscript/GIS/field RF/DO validation, OS CPU/memory limit or malicious cross-session authentication claim." >> "$GITHUB_STEP_SUMMARY"

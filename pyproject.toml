[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-opt-dashboard-ui-imports"
version = "0.1.0"
description = "Qualified Python package anchors for the staged scientific dashboard UI import migration"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["prototypes", "prototypes.streamlit_configurable", "prototypes.streamlit_water_quality", "prototypes.unified_dashboard", "problems", "problems.evacuation_centers", "problems.water_quality", "qopt", "qopt.core"]

[tool.setuptools.package-dir]
qopt = "framework/python/qopt"
